<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Square One">
  <!-- Favicon reduction of the Square One mark, 21 Sept 2026. The full mark
       (two pale chevrons behind an orange diamond) was drawn on transparency,
       so its light shapes vanished on a light background and the three
       overlapping forms collapsed into a smudge below 32px. A favicon gets
       one shape: the orange diamond — a square stood on its corner, which is
       the company's name — on the charcoal the footer already uses. -->
  <rect width="512" height="512" fill="#2D2D2D"/>
  <path d="M256 106 L406 256 L256 406 L106 256 Z" fill="#C85A3A"/>
</svg>
